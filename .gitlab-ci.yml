variables:
  CI_SERVER_URL: http://makebe-gitlab

stages:
  - build
  - deploy
  - deploy-prod

build:
  stage: build
  image: node:20.9.0
  script:
    - rm -rf node_modules
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist/
  tags:
    - docker
  only:
    - main

deploy:
  stage: deploy
  image: docker:25.0.2
  before_script:
    - apk update && apk add --no-cache sshpass
  script:
    - docker pull makebe-vitrine:latest || true
    - docker build -t makebe-vitrine:latest .
    - docker stop makebe-vitrine || true
    - docker rm makebe-vitrine || true
    - >
      docker run -d --name makebe-vitrine -p 8082:80
      -v /etc/localtime:/etc/localtime:ro
      makebe-vitrine:latest
    - docker network connect dockercompose_makebe-rede makebe-vitrine || true
    - |
      sshpass -p "$DOCKER_PASSWORD" ssh -o StrictHostKeyChecking=no "$DOCKER_USER@$DOCKER_NETWORK" "
        docker cp makebe-vitrine:/usr/share/nginx/html/vitrine /home/makebe-user/sites/makebe-vitrine
      "
  tags:
    - docker
  only:
    - main
  when: manual
  environment:
    name: homolog

deploy-prod:
  stage: deploy-prod
  image: alpine:latest
  needs: ["build"]
  before_script:
   - apk add --no-cache openssh-client
   - mkdir -p ~/.ssh
   - echo "$AWS_DEPLOY_KEY" | base64 -d > ~/.ssh/id_ed25519
   - chmod 600 ~/.ssh/id_ed25519
   - echo "AWS_HOST=[$AWS_HOST]"
   - echo "AWS_USER=[$AWS_USER]"
   - echo "SSH_TARGET=[$AWS_USER@$AWS_HOST]"
   - ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts
   - export AWS_PATH_CLEAN="$(printf '%s' "$AWS_PATH")"
  script:
    - ssh -vvv -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$AWS_USER@$AWS_HOST" "echo CONECTOU"
    - ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$AWS_USER@$AWS_HOST" "mkdir -p \"$AWS_PATH_CLEAN\""
    - scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -r dist "$AWS_USER@$AWS_HOST_CLEAN:$AWS_PATH_CLEAN/"
    - scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no Dockerfile.dist "$AWS_USER@$AWS_HOST:$AWS_PATH_CLEAN/"
    - scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no nginx.conf "$AWS_USER@$AWS_HOST_CLEAN:$AWS_PATH_CLEAN/"
    - ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$AWS_USER@$AWS_HOST_CLEAN" "cd \"$AWS_PATH_CLEAN\" && docker build -f Dockerfile.dist -t makebe-vitrine:latest ."
    - ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$AWS_USER@$AWS_HOST_CLEAN" "docker stop makebe-vitrine 2>/dev/null || true"
    - ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$AWS_USER@$AWS_HOST_CLEAN" "docker rm makebe-vitrine 2>/dev/null || true"
    - ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$AWS_USER@$AWS_HOST_CLEAN" "docker run -d --name makebe-vitrine -p 8081:80 -v /etc/localtime:/etc/localtime:ro makebe-vitrine:latest"
  tags:
    - docker
  only:
    - main
  when: manual
  environment:
    name: production
